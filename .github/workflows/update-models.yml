name: Actualizar modelos

on:
  schedule:
    - cron: "55 0,6,12,18 * * *"
  workflow_dispatch: {}
  push:
    branches: [main, master]
    paths:
      - "fetch_models.py"
      - "schema.py"
      - "build_data.py"
      - "build_page.py"
      - "enrich_*.py"
      - "common.py"
      - "build.sh"
      - "assets/**"
      - ".github/workflows/update-models.yml"

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Generar web en public/
        run: ./build.sh

      - name: Resumen de errores por proveedor
        if: always()
        run: |
          echo "## Errores por proveedor" >> "$GITHUB_STEP_SUMMARY"
          cat public/data/errors.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(sin datos: el build no generó public/data)" >> "$GITHUB_STEP_SUMMARY"

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
